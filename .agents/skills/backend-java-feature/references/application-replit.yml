# application-replit.yml — Replit profile overrides.
#
# Replit's postgresql-16 module exposes individual PG* env vars. Use them
# directly; do not add a custom EnvironmentPostProcessor or force sslmode.

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:${POSTGRES_HOST:localhost}}:${PGPORT:${POSTGRES_PORT:5432}}/${PGDATABASE:${POSTGRES_DB:app}}
    username: ${PGUSER:${POSTGRES_USER:app}}
    password: ${PGPASSWORD:${POSTGRES_PASSWORD:app}}
    hikari:
      maximum-pool-size: 3       # Replit's managed SQL DB has a low conn ceiling
      minimum-idle: 0
      idle-timeout: 30000
      connection-timeout: 5000
      auto-commit: false

server:
  port: ${PORT:5000}

app:
  usage-logging:
    environment: ${USAGE_LOG_ENVIRONMENT:dev}
