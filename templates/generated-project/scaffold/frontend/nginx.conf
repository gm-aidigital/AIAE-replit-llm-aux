# SPA + reverse proxy for /api/* to the backend service.
# Used by frontend/Dockerfile in local-dev / handoff. Replit deployment
# bypasses this entirely (Spring serves the SPA itself from static).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history-mode routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to backend (service name from docker-compose.yml).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
