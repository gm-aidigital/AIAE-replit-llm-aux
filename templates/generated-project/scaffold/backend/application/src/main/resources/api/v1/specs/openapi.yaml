openapi: 3.0.3
info:
  title: Replit MVP API
  version: 0.1.0
  description: |
    Starter contract. Replace with the real spec for your domain BEFORE
    writing controllers — the rest of the codebase generates from here
    (backend interfaces + frontend types).

    Schemas are versioned EXPLICITLY in their names (UserV1,
    AppApiExceptionResponseV1). When V2 ships, add UserV2 / Create…V2
    schemas alongside V1; V1 keeps working until the last consumer migrates.
servers:
  - url: /api/v1
    description: V1 base path (DOCUMENTATION ONLY — the openapi-generator-maven-plugin
      does NOT prepend this to generated Spring routes. Path keys below carry the
      `/api/v1/` prefix verbatim. See canonical-openapi-rules.md → "/api/v1 prefix").

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Authentication bootstrap

paths:
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Returns the authenticated user (Clerk SSO)
      description: Returns the Clerk-authenticated user identity used by the SPA bootstrap.
      responses:
        "200":
          description: Authenticated user payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV1"
              examples:
                demo:
                  value:
                    user_id: "user_123"
                    email: "demo-user@example.com"
                    full_name: "Demo User"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while resolving authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserV1:
      type: object
      additionalProperties: false
      description: Authenticated user identity projected from Clerk JWT claims.
      required: [user_id, email]
      properties:
        user_id:   { type: string, description: "Clerk user id (sub/user_id claim)." }
        email:     { type: string, format: email, description: "Primary email address verified by Clerk." }
        full_name: { type: string, description: "Display name assembled from Clerk profile claims." }

    AppValidationExceptionResponseV1:
      type: object
      additionalProperties: false
      description: Representation of validation exception occurred in REST API format.
      required: [errors, timestamp, correlationId]
      properties:
        errors:
          description: The list of validation errors occurred.
          type: array
          items:
            $ref: "#/components/schemas/FieldToErrorResponseV1"
        timestamp:
          type: string
          format: date-time
          description: The timestamp exception occurred.
        correlationId:
          type: string
          description: The log stream UUID.

    FieldToErrorResponseV1:
      type: object
      additionalProperties: false
      description: Representation of validation error bound to a field or semantic request part.
      required: [code, field, error]
      properties:
        code:  { type: string, description: "The code of validation error occurred." }
        field: { type: string, description: "The field or semantic request part not passed validation." }
        error: { type: string, description: "The validation error occurred." }

    AppApiExceptionResponseV1:
      type: object
      additionalProperties: false
      description: Representation of exception occurred in REST API format.
      required: [code, message, timestamp, correlationId]
      properties:
        code:          { type: string, description: "The code of exception occurred." }
        message:       { type: string, description: "The message of exception occurred." }
        timestamp:     { type: string, format: date-time, description: "The timestamp exception occurred." }
        correlationId: { type: string, description: "The log stream UUID." }


