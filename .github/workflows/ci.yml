name: Replit Template Integrity

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  template-integrity:
    name: Template integrity checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required template files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            # === Template control plane (root) ===
            "replit.md"
            ".replit"
            "replit.nix"
            "custom_instruction/instructions.md"

            # === SKILL files ===
            ".agents/skills/backend-java-feature/SKILL.md"
            ".agents/skills/backend-java-feature/references/hikari-jpa-baseline.yml"
            ".agents/skills/backend-java-feature/references/application-replit.yml"
            ".agents/skills/backend-java-feature/references/database-url-translation.md"
            ".agents/skills/backend-java-feature/references/spring-boot-gotchas.md"
            ".agents/skills/backend-java-feature/references/code-patterns.md"
            ".agents/skills/openapi-contract-first/SKILL.md"
            ".agents/skills/frontend-react-feature/SKILL.md"
            ".agents/skills/mvp-safety-review/SKILL.md"
            ".agents/skills/engineering-handoff/SKILL.md"

            # === Canonical docs (templates/generated-project/) ===
            "templates/generated-project/.github/workflows/ci.yml"
            "templates/generated-project/openapi/openapi-review-checklist.md"
            "templates/generated-project/openapi/canonical-openapi-rules.md"
            "templates/generated-project/auth/google-sso-clerk-blueprint.md"
            "templates/generated-project/frontend/canonical-react-frontend-rules.md"
            "templates/generated-project/frontend/elevate-design-guidelines.md"
            "templates/generated-project/frontend/bem-naming-rules.md"
            "templates/generated-project/structure/near-production-project-structure.md"
            "templates/generated-project/generation/token-efficient-generation-rules.md"
            "templates/generated-project/observability/usage-logging-rules.md"
            "templates/generated-project/observability/logbook-http-logging-rules.md"
            "templates/generated-project/errors/error-handling-pattern.md"
            "templates/generated-project/testing/testing-policy.md"

            # === Scaffold root ===
            "templates/generated-project/scaffold/.gitignore"
            "templates/generated-project/scaffold/.env.example"
            "templates/generated-project/scaffold/README.md.template"
            "templates/generated-project/scaffold/docker-compose.yml"
            "templates/generated-project/scaffold/scripts/setup-project.sh"

            # === Scaffold backend root ===
            "templates/generated-project/scaffold/backend/Dockerfile"
            "templates/generated-project/scaffold/backend/lombok.config"
            "templates/generated-project/scaffold/backend/pom.xml"
            "templates/generated-project/scaffold/backend/config/checkstyle.xml"
            "templates/generated-project/scaffold/backend/config/checkstyle-suppressions.xml"

            # === Scaffold backend modules — poms ===
            "templates/generated-project/scaffold/backend/application/pom.xml"
            "templates/generated-project/scaffold/backend/service/pom.xml"
            "templates/generated-project/scaffold/backend/domain/pom.xml"
            "templates/generated-project/scaffold/backend/db/pom.xml"

            # === Scaffold application module (Java) ===
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/Application.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/config/ApplicationMapperConfig.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/config/LogbookConfig.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/config/OpenApiSpecConfig.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/security/SecurityConfig.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/security/MockJwtDecoder.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/security/AuthConstants.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/security/AuthProperties.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/security/AppUserFactory.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/auth/MockTokenService.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/auth/controllers/AuthController.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/error/GlobalExceptionHandler.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/observability/CorrelationIdFilter.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/observability/usage/UsageLoggingAspect.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/observability/usage/UsageLoggingConfig.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/observability/usage/UsageLoggingProperties.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/observability/usage/PostgresUsageLogger.java"
            "templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/observability/usage/NoOpUsageLogger.java"

            # === Scaffold sample tests — proof that test infra works ===
            "templates/generated-project/scaffold/backend/application/src/test/java/PACKAGE_REPLACE_ME/ApplicationSmokeTest.java"
            "templates/generated-project/scaffold/backend/application/src/test/java/PACKAGE_REPLACE_ME/auth/controllers/AuthControllerTest.java"
            "templates/generated-project/scaffold/backend/application/src/test/java/PACKAGE_REPLACE_ME/db/LiquibaseChangelogSmokeTest.java"
            "templates/generated-project/scaffold/backend/service/src/test/java/PACKAGE_REPLACE_ME/service/sample/services/impl/SampleServiceImplTest.java"
            "templates/generated-project/scaffold/frontend/src/App.test.tsx"

            # === Scaffold deploy / verify scripts ===
            "templates/generated-project/scaffold/scripts/replit-build.sh"
            "templates/generated-project/scaffold/scripts/replit-run.sh"
            "templates/generated-project/scaffold/scripts/local-verify.sh"

            # === Scaffold service module (Java) — AppException family + LogUsage live HERE ===
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/common/error/AppException.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/common/error/ErrorReason.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/common/error/ValidationMessage.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/common/error/ValidationParameter.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/common/error/ValidationMessageType.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/common/observability/LogUsage.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/common/observability/UsageEvent.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/common/observability/UsageLogger.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/common/mapping/ServiceMapperConfig.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/common/security/AppUser.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/auth/models/MockLoginRecord.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/sample/services/SampleService.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/sample/services/impl/SampleServiceImpl.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/sample/mappers/SampleMapper.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/sample/models/SampleRecord.java"
            "templates/generated-project/scaffold/backend/service/src/main/java/PACKAGE_REPLACE_ME/service/sample/models/SampleUpdate.java"

            # === Scaffold application resources ===
            "templates/generated-project/scaffold/backend/application/src/main/resources/application.yml"
            "templates/generated-project/scaffold/backend/application/src/main/resources/application-replit.yml"
            "templates/generated-project/scaffold/backend/application/src/main/resources/application-local.yml"
            "templates/generated-project/scaffold/backend/application/src/main/resources/logback-spring.xml"
            "templates/generated-project/scaffold/backend/application/src/main/resources/api/v1/specs/openapi.yaml"

            # === Scaffold db module (Liquibase) ===
            "templates/generated-project/scaffold/backend/db/src/main/resources/db/changelog/db.changelog-master.xml"
            "templates/generated-project/scaffold/backend/db/src/main/resources/db/changelog/changes/0001-usage-events.xml"
            "templates/generated-project/scaffold/backend/db/src/main/resources/db/changelog/changes/0002-sample-reference.xml"

            # === Scaffold frontend ===
            "templates/generated-project/scaffold/frontend/Dockerfile"
            "templates/generated-project/scaffold/frontend/nginx.conf"
            "templates/generated-project/scaffold/frontend/package.json"
            "templates/generated-project/scaffold/frontend/package-lock.json"
            "templates/generated-project/scaffold/frontend/vite.config.ts"
            "templates/generated-project/scaffold/frontend/tsconfig.json"
            "templates/generated-project/scaffold/frontend/index.html"
            "templates/generated-project/scaffold/frontend/src/main.tsx"
            "templates/generated-project/scaffold/frontend/src/App.tsx"
            "templates/generated-project/scaffold/frontend/src/App.css"
            "templates/generated-project/scaffold/frontend/src/shared/api/client.ts"
            "templates/generated-project/scaffold/frontend/src/shared/config/runtime.ts"
            "templates/generated-project/scaffold/frontend/src/shared/config/runtime.test.ts"
            "templates/generated-project/scaffold/frontend/src/shared/ui/base/tokens.css"
            "templates/generated-project/scaffold/frontend/src/shared/ui/base/reset.css"
            "templates/generated-project/scaffold/frontend/src/shared/lib/cn.ts"
          )
          for file in "${required_files[@]}"; do
            test -f "${file}" || { echo "Missing required file: ${file}"; exit 1; }
          done

      - name: Validate replit.md structure
        shell: bash
        run: |
          set -euo pipefail
          for section in "## Overview" "## User Preferences" "## System Architecture" "## External Dependencies"; do
            grep -Fq "${section}" replit.md || {
              echo "replit.md is missing required section: ${section}"
              exit 1
            }
          done
          # Soft limit: ~4000 tokens ≈ 16000 bytes for safety.
          size=$(wc -c < replit.md)
          if [ "${size}" -gt 16000 ]; then
            echo "replit.md is ${size} bytes; keep it under ~16KB (~4000 tokens)."
            exit 1
          fi

      - name: Validate custom instructions size
        shell: bash
        run: |
          set -euo pipefail
          # Replit soft limit is ~25KB. Warn earlier at 20KB.
          size=$(wc -c < custom_instruction/instructions.md)
          if [ "${size}" -gt 20000 ]; then
            echo "custom_instruction/instructions.md is ${size} bytes; keep under 20KB."
            exit 1
          fi

      - name: Validate SKILL.md frontmatter (Agent Skills spec)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r skill; do
            dir=$(dirname "${skill}")
            expected_name=$(basename "${dir}")

            head -n 1 "${skill}" | grep -qE '^---$' || {
              echo "${skill}: must start with --- frontmatter delimiter"
              fail=1; continue
            }

            name=$(awk '/^---$/{c++; next} c==1 && /^name:/ {sub(/^name:[[:space:]]*/,""); print; exit}' "${skill}")
            desc=$(awk '/^---$/{c++; next} c==1 && /^description:/ {sub(/^description:[[:space:]]*/,""); print; exit}' "${skill}")

            if [ "${name}" != "${expected_name}" ]; then
              echo "${skill}: frontmatter name='${name}' must equal parent dir '${expected_name}'"
              fail=1
            fi
            if ! echo "${name}" | grep -qE '^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$'; then
              echo "${skill}: name '${name}' violates Agent Skills spec (lowercase a-z 0-9 and -, no leading/trailing hyphen, <=64 chars)"
              fail=1
            fi
            if echo "${name}" | grep -q -- '--'; then
              echo "${skill}: name '${name}' has consecutive hyphens"
              fail=1
            fi
            if [ -z "${desc}" ]; then
              echo "${skill}: description must be non-empty"
              fail=1
            fi
            desc_len=$(printf '%s' "${desc}" | wc -c)
            if [ "${desc_len}" -gt 1024 ]; then
              echo "${skill}: description is ${desc_len} chars (>1024)"
              fail=1
            fi
            if awk '/^---$/{c++; next} c==1' "${skill}" | grep -qE '^(argument-hint|user-invocable):'; then
              echo "${skill}: argument-hint / user-invocable are not in the Agent Skills spec; move under metadata:"
              fail=1
            fi
          done < <(find .agents/skills -name SKILL.md)
          exit "${fail}"

      - name: Validate skill references from replit.md and instructions.md
        shell: bash
        run: |
          set -euo pipefail
          for src in replit.md custom_instruction/instructions.md; do
            refs="$(grep -oE '\.agents/skills/[A-Za-z0-9._-]+/SKILL\.md' "${src}" | sort -u || true)"
            while IFS= read -r ref; do
              [ -z "${ref}" ] && continue
              test -f "${ref}" || { echo "${src}: broken skill reference: ${ref}"; exit 1; }
            done <<< "${refs}"
          done

      - name: Validate template repository scope wording
        shell: bash
        run: |
          set -euo pipefail
          grep -q "generated project repository" custom_instruction/instructions.md || {
            echo "instructions.md must explicitly state generated-project-repository scope"
            exit 1
          }
          grep -q "Custom Template configuration repository" replit.md || {
            echo "replit.md must explicitly state template repository scope"
            exit 1
          }

      - name: Validate scaffold consistency
        shell: bash
        run: |
          set -euo pipefail
          # PACKAGE_REPLACE_ME is the only allowed Java-package placeholder
          # token. Anywhere else it appears, treat as drift.
          for f in templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/Application.java \
                   templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/config/OpenApiSpecConfig.java; do
            grep -q 'PACKAGE_REPLACE_ME' "$f" || { echo "Scaffold $f lost the PACKAGE_REPLACE_ME placeholder"; exit 1; }
          done
          test -f templates/generated-project/scaffold/backend/application/src/main/resources/api/v1/specs/openapi.yaml \
            || { echo "Scaffold OpenAPI spec must live outside static/"; exit 1; }
          test ! -f templates/generated-project/scaffold/backend/application/src/main/resources/static/api/v1/specs/openapi.yaml \
            || { echo "OpenAPI spec must not live under static/ because Vite build wipes it"; exit 1; }
          # Liquibase master must include the usage-events changelog.
          master='templates/generated-project/scaffold/backend/db/src/main/resources/db/changelog/db.changelog-master.xml'
          grep -q '0001-usage-events.xml' "$master" \
            || { echo "Liquibase master changelog does not include 0001-usage-events.xml"; exit 1; }
          grep -q '0002-sample-reference.xml' "$master" \
            || { echo "Liquibase master changelog does not include 0002-sample-reference.xml"; exit 1; }
          # Frontend package.json must define the canonical scripts.
          pj='templates/generated-project/scaffold/frontend/package.json'
          for k in '"generate:api"' '"check:api"' '"test"' 'openapi-typescript' 'openapi-fetch' '@tanstack/react-query' '@clerk/clerk-react' 'vitest' '@testing-library/react'; do
            grep -q "$k" "$pj" || { echo "Scaffold frontend/package.json missing $k"; exit 1; }
          done
          readme='templates/generated-project/scaffold/README.md.template'
          for k in '^## What this is' '^## API' 'Swagger UI' 'OpenAPI YAML'; do
            grep -q "$k" "$readme" || { echo "Scaffold README template missing $k"; exit 1; }
          done
          # Guard Replit failures seen in generated projects.
          grep -q 'mvn -f backend/application/pom.xml' .replit \
            || { echo ".replit must run spring-boot:run from backend/application/pom.xml"; exit 1; }
          ! grep -Eq 'spring-boot:run.*backend/pom.xml|-pl application -am .*spring-boot:run' .replit \
            || { echo ".replit must not run spring-boot:run on the parent reactor"; exit 1; }
          grep -q 'npm run generate:api' .replit \
            || { echo ".replit frontend workflow must generate OpenAPI types before Vite"; exit 1; }
          grep -q 'PORT = "5000"' .replit \
            || { echo ".replit [env] must keep PORT = \"5000\""; exit 1; }
          grep -q 'localPort = 5000' .replit && grep -q 'externalPort = 80' .replit \
            || { echo ".replit must expose exactly backend 5000 -> externalPort 80"; exit 1; }
          ! grep -Eq 'npm run dev.*--port 5000|vite.*--port 5000|localPort = 5173' .replit \
            || { echo "Vite must not run on/expose 5000; backend owns the public Replit port"; exit 1; }
          grep -Eq '^VITE_API_BASE_URL=' templates/generated-project/scaffold/.env.example \
            || { echo "Scaffold .env.example must define VITE_API_BASE_URL"; exit 1; }
          grep -q 'resolve:' templates/generated-project/scaffold/frontend/vite.config.ts \
            || { echo "Vite config must define resolve.alias for @/*"; exit 1; }
          grep -q '"@"' templates/generated-project/scaffold/frontend/vite.config.ts \
            || { echo "Vite config missing @ alias"; exit 1; }
          grep -q 'CLERK_PUBLISHABLE_KEY' templates/generated-project/scaffold/frontend/vite.config.ts \
            || { echo "Vite config must map Replit CLERK_PUBLISHABLE_KEY into VITE_CLERK_PUBLISHABLE_KEY"; exit 1; }
          ! grep -RInE '(baseUrl|apiBaseUrl|BASE_URL)[[:space:]]*[:=][[:space:]]*["'\'']/api/v1/?["'\'']' \
              templates/generated-project/scaffold/frontend/src/shared/api \
              templates/generated-project/scaffold/frontend/src/shared/config >/dev/null \
            || { echo "Frontend apiBaseUrl/baseUrl/BASE_URL must not duplicate /api/v1"; exit 1; }
          ! grep -RInE '^VITE_API_BASE_URL=/api/v1/?$' \
              templates/generated-project/scaffold/.env.example \
              templates/generated-project/scaffold/frontend/.env* >/dev/null 2>&1 \
            || { echo "VITE_API_BASE_URL must not be /api/v1"; exit 1; }
          ! grep -RInE 'fetch[[:space:]]*\(|from[[:space:]]+["'\'']axios["'\'']|axios\.|new[[:space:]]+XMLHttpRequest' \
              --include='*.ts' --include='*.tsx' templates/generated-project/scaffold/frontend/src >/dev/null \
            || { echo "Frontend must use typed shared/api/client.ts, not raw fetch/axios/XMLHttpRequest"; exit 1; }
          ! grep -RInE 'Sidebar|SideNav|LeftNav|side-nav|side-menu|left-nav|left-menu|app__sidebar|layout__sidebar' \
              --include='*.ts' --include='*.tsx' --include='*.css' templates/generated-project/scaffold/frontend/src >/dev/null \
            || { echo "Frontend scaffold must not include a left side menu/sidebar"; exit 1; }
          ruby <<'RUBY'
          require "yaml"

          spec_path = "templates/generated-project/scaffold/backend/application/src/main/resources/api/v1/specs/openapi.yaml"
          spec = YAML.load_file(spec_path)
          allowed = {}
          (spec["paths"] || {}).each do |path, methods|
            methods.each_key do |method|
              next unless %w[get post put patch delete options head].include?(method)
              allowed[[method.upcase, path]] = true
            end
          end

          errors = []
          Dir["templates/generated-project/scaffold/frontend/src/**/*.{ts,tsx}"].each do |file|
            File.read(file).scan(/apiClient\.(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)\(\s*["']([^"']+)["']/) do |method, path|
              next if allowed[[method, path]]
              errors << "#{file}: apiClient.#{method}(\"#{path}\") is not defined in #{spec_path}"
            end
          end

          abort(errors.join("\n")) unless errors.empty?
          RUBY
          ! grep -RIn '^AUTH_[A-Z_]*:[[:space:]]*\${AUTH_' \
              templates/generated-project/scaffold/backend/application/src/main/resources >/dev/null \
            || { echo "AUTH_* top-level YAML placeholders create circular references"; exit 1; }
          grep -q 'port:[[:space:]]*\${PORT:5000}' \
              templates/generated-project/scaffold/backend/application/src/main/resources/application-replit.yml \
            || { echo "application-replit.yml must keep server.port: \${PORT:5000}"; exit 1; }
          grep -Fq 'url: jdbc:postgresql://${PGHOST' \
              templates/generated-project/scaffold/backend/application/src/main/resources/application-replit.yml \
            || { echo "application-replit.yml must set datasource URL from PGHOST/PGPORT/PGDATABASE"; exit 1; }
          grep -Fq 'username: ${PGUSER' \
              templates/generated-project/scaffold/backend/application/src/main/resources/application-replit.yml \
            || { echo "application-replit.yml must set datasource username from PGUSER"; exit 1; }
          grep -Fq 'password: ${PGPASSWORD' \
              templates/generated-project/scaffold/backend/application/src/main/resources/application-replit.yml \
            || { echo "application-replit.yml must set datasource password from PGPASSWORD"; exit 1; }
          ! grep -RIn 'sslmode=require' \
              templates/generated-project/scaffold/backend/application/src/main/resources/application-replit.yml >/dev/null \
            || { echo "application-replit.yml must not force sslmode=require"; exit 1; }
          ! grep -RInE 'ReplitDatabaseUrlPostProcessor|EnvironmentPostProcessor.imports|spring.factories' \
              templates/generated-project/scaffold/backend/application/src/main >/dev/null \
            || { echo "Scaffold must not use datasource EnvironmentPostProcessor registration"; exit 1; }
          grep -q '<groupId>org.postgresql</groupId>' templates/generated-project/scaffold/backend/application/pom.xml \
              && grep -q '<artifactId>postgresql</artifactId>' templates/generated-project/scaffold/backend/application/pom.xml \
            || { echo "application/pom.xml must declare the PostgreSQL runtime driver"; exit 1; }
          grep -q '<artifactId>h2</artifactId>' templates/generated-project/scaffold/backend/application/pom.xml \
            || { echo "application/pom.xml must keep H2 test dependency for ApplicationSmokeTest"; exit 1; }
          grep -q '/actuator/prometheus' \
              templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/security/AuthConstants.java \
            || { echo "/actuator/prometheus must stay public"; exit 1; }
          grep -Fq '"/"' templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/security/AuthConstants.java \
              && grep -Fq '"/assets/**"' templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/security/AuthConstants.java \
            || { echo "React shell and static assets must stay public in AuthConstants"; exit 1; }
          backend_dir="templates/generated-project/scaffold/backend"
          for module in $(sed -n 's:.*<module>\(.*\)</module>.*:\1:p' "${backend_dir}/pom.xml"); do
            module_dir="${backend_dir}/${module}"
            [ -d "${module_dir}" ] || { echo "backend/pom.xml lists missing module: ${module}"; exit 1; }
            [ -d "${module_dir}/src" ] \
                && find "${module_dir}/src" -type f ! -path '*/target/*' | grep -q . \
              || { echo "Maven module must not be empty/POM-only: ${module}"; exit 1; }
          done
          if [ ! -f "${backend_dir}/external-services/pom.xml" ]; then
            ! grep -RIn '<artifactId>external-services</artifactId>\|<module>external-services</module>' \
                "${backend_dir}/pom.xml" "${backend_dir}/service/pom.xml" >/dev/null 2>&1 \
              || { echo "external-services is optional; do not reference it when no module exists"; exit 1; }
          fi
          grep -q 'app.auth.sso.jwk-set-uri' \
              templates/generated-project/scaffold/backend/application/src/main/java/PACKAGE_REPLACE_ME/security/AuthConstants.java \
            || { echo "AUTH_MODE=auto must require issuer/JWKS before enabling SSO"; exit 1; }
          ! grep -Eq 'spring-boot-starter-(security|oauth2-resource-server|web)|spring-security|jakarta.servlet-api|jjwt-' \
              templates/generated-project/scaffold/backend/service/pom.xml \
            || { echo "service/pom.xml must not depend on web/security/servlet/JWT libraries"; exit 1; }
          ! grep -RInE 'SecurityContextHolder|JwtDecoder|JwtAuthenticationToken|io\.jsonwebtoken|org\.springframework\.security|org\.springframework\.web|jakarta\.servlet' \
              templates/generated-project/scaffold/backend/service/src/main/java >/dev/null \
            || { echo "service source must not import web/security/JWT/servlet APIs"; exit 1; }

      - name: No service-account JSON in the template itself
        shell: bash
        run: |
          set -euo pipefail
          # Look only at *.json files; ignore markdown/yml/workflow files that
          # legitimately describe the very patterns we're protecting against.
          found=0
          while IFS= read -r f; do
            if grep -E -q '"private_key_id"|"type"[[:space:]]*:[[:space:]]*"service_account"|BEGIN PRIVATE KEY' "${f}"; then
              echo "Service-account JSON detected: ${f}"
              found=1
            fi
          done < <(find . -path ./.git -prune -o -type f -name '*.json' -print)
          [ "${found}" -eq 0 ] || exit 1

  scaffold-compile:
    name: Scaffold compiles
    runs-on: ubuntu-latest
    needs: template-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Materialize scaffold as a generated project
        # Copy backend/ to a fresh dir, replace PACKAGE_REPLACE_ME with a real
        # package path, then attempt to compile. Catches future regressions
        # like the SampleEntity/UsageEvent gap the scaffold used to ship with.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scaffold-test
          cp -r templates/generated-project/scaffold/backend /tmp/scaffold-test/backend
          cd /tmp/scaffold-test
          # Rename PACKAGE_REPLACE_ME dirs and replace token in file contents.
          find backend -depth -name PACKAGE_REPLACE_ME -execdir mv {} replitmvp \;
          find backend -type f \( -name '*.java' -o -name '*.xml' -o -name '*.yml' -o -name '*.yaml' \) \
            -exec sed -i 's/PACKAGE_REPLACE_ME/replitmvp/g' {} +
          mvn -f backend/pom.xml -B -Dskip.frontend=true -DskipTests -Dgit-commit-id.skip=true compile
